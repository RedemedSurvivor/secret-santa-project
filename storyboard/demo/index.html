<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#240f27"><title>Cousins’ Christmas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Explora&display=swap');

:root{color-scheme:dark;--ink:#311733;--paper:#fff4dc;--orange:#ff7443}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#240f27;color:var(--paper);font:16px system-ui}main{max-width:500px;margin:auto;padding:24px 16px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}header strong{font-family:Georgia,serif}button,input{font:inherit;min-height:48px;border-radius:12px}button{cursor:pointer;border:0;background:var(--orange);color:var(--ink);font-weight:750;padding:10px 16px}button:disabled{opacity:.65;cursor:default}.quiet{background:transparent;color:inherit;border:1px solid currentColor}.panel{background:var(--paper);color:var(--ink);border-radius:26px;padding:clamp(18px,5vw,34px);text-align:center;overflow:hidden}h1{font:clamp(42px,10vw,64px)/.97 Georgia,serif;letter-spacing:-.055em;margin:16px 0}p{line-height:1.5}small,label{display:block}label{text-align:left;font-weight:700;margin:24px 0 6px}input{width:100%;background:#fffbef;color:var(--ink);border:1px solid var(--ink);padding:0 12px}form button,.actions button{width:100%;margin-top:10px}.stamp{display:grid;place-items:center;margin:22px auto 34px;width:132px;height:95px;background:var(--orange);transform:rotate(-10deg);outline:5px solid var(--orange);border:2px dashed var(--ink);box-shadow:10px 13px var(--ink);font:50px Georgia}.wheel-wrap{position:relative;width:min(100%,330px);margin:22px auto 12px}.wheel-wrap canvas{width:100%;display:block}.pin{position:absolute;top:-9px;left:calc(50% - 15px);width:30px;height:31px;background:var(--orange);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0}.perspective{perspective:900px;padding:15px 6px;touch-action:pan-y}.card{position:relative;overflow:hidden;border-radius:24px;padding:24px 12px 28px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease;background:#ffc09d;border:1px solid #8b425c;box-shadow:0 14px 26px #31173336}.card:after{position:absolute;inset:0;pointer-events:none;content:'';background:linear-gradient(136deg,transparent calc(var(--sheen,50%) - 13%),#fff8dfab var(--sheen,50%),transparent calc(var(--sheen,50%) + 13%));opacity:var(--shine,0);transition:opacity .25s;mix-blend-mode:screen}.portrait{width:min(100%,220px);display:block;margin:auto}.eye,.smile,.hand{transform-box:fill-box;transform-origin:center}.arrive .portrait{animation:land .68s cubic-bezier(.16,1,.3,1) both}.arrive .eye{animation:wink .4s .7s}.arrive .smile{animation:grin .48s .24s both}.arrive .hand{animation:wave .27s .75s 4 alternate}@keyframes land{from{transform:translateY(21px) scale(.84);opacity:0}}@keyframes wink{50%{transform:scaleY(.13)}}@keyframes grin{from{transform:scale(.7,.18)}}@keyframes wave{to{transform:rotate(22deg)}}[hidden]{display:none!important}:focus-visible{outline:3px solid #b7472b;outline-offset:3px}@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}.card{transform:none}}
:root{--page:#240f27;--chrome:#fff4dc;--surface:#fff4dc;--text:#311733}
:root[data-theme="light"]{color-scheme:light;--page:#f1ddbe;--chrome:#311733;--surface:#fff9ea;--text:#311733}
:root[data-theme="dark"]{--surface:#402043;--text:#fff4dc}
body{background:var(--page);color:var(--chrome)}.panel{background:var(--surface);color:var(--text)}.card{color:#311733}.settings{display:flex;gap:6px;flex-wrap:wrap}.settings button{font-size:12px;padding:7px 9px}.intro{min-height:72svh;display:grid;align-content:center;justify-items:center;background:radial-gradient(ellipse at 45% 35%,#653051 0%,#351538 70%);color:#fff4dc}.signature{font:clamp(86px,25vw,156px)/1 'Explora','Segoe Script',cursive;letter-spacing:-.07em;white-space:nowrap;margin:0 0 24px;padding:0 .12em}.signature span{display:inline-block;clip-path:inset(-15% 110% -30% -10%);animation:write-letter .38s ease-out forwards;animation-delay:calc(var(--i)*.155s)}@keyframes write-letter{to{clip-path:inset(-15% -15% -30% -10%)}}.wheel-wrap{border:0;background:transparent;padding:0;display:block;touch-action:none}.wheel-wrap:disabled{opacity:1}.wheel-wrap:enabled:active{transform:scale(.98)}#suspense{min-height:60svh;display:grid;align-content:center}#suspense h1{animation:hold 1.18s ease both}@keyframes hold{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.signature span{clip-path:none}}</style>
<main>
<header><strong>Cousins’ Christmas</strong><div class="settings"><button id="theme" type="button" class="quiet">Light mode</button><button id="sound" type="button" class="quiet" aria-pressed="false">Sound off</button></div></header>
<section id="intro" class="panel intro"><h1 class="signature" aria-label="Njithi's"><span style="--i:0">N</span><span style="--i:1">j</span><span style="--i:2">i</span><span style="--i:3">t</span><span style="--i:4">h</span><span style="--i:5">i</span><span style="--i:6">&#39;</span><span style="--i:7">s</span></h1><button id="open">Open the invite</button></section><section id="entry" class="panel" hidden><div class="stamp" aria-hidden="true">✦</div><h1 tabindex="-1">Hiii Cousins</h1><p>Enter the code you got from the host.</p>
<form><label for="code">Your code</label><input id="code" required maxlength="48" autocomplete="off" spellcheck="false" placeholder="Mango Lantern 47"><button>Continue</button></form><p id="error" role="alert" hidden>Try the demo code below.</p><small>Demo code <strong>Mango Lantern 47</strong></small></section>
<section id="stage" class="panel" hidden><h1 tabindex="-1">Hello, Ishmael.</h1><p>Tap the wheel to see who you’re buying for.</p><button id="spin" class="wheel-wrap" aria-label="Spin the wheel"><canvas width="330" height="330" aria-hidden="true"></canvas><span class="pin"></span></button><div class="actions"><button id="skip" class="quiet">Reveal now</button></div></section>
<section id="suspense" class="panel" hidden><h1 tabindex="-1">Here comes your cousin…</h1></section><section id="result" class="panel" hidden><div class="perspective"><article class="card"><p>You’re buying for</p>
<svg class="portrait" viewBox="0 0 210 200" role="img" aria-label="Amani smiling and waving"><defs><radialGradient id="skin" cx="33%" cy="23%" r="80%"><stop stop-color="#df9b71"/><stop offset=".65" stop-color="#ad6546"/><stop offset="1" stop-color="#86432e"/></radialGradient><linearGradient id="shirt" x2=".8" y2="1"><stop stop-color="#77446f"/><stop offset="1" stop-color="#331735"/></linearGradient></defs><circle cx="105" cy="98" r="89" fill="#ff7443" stroke="#311733" stroke-width="3"/><path d="M28 153Q99 114 171 156Q146 185 105 187Q56 187 28 153" fill="url(#shirt)"/><path d="M80 119H128V141Q103 162 80 142Z" fill="#9a522e"/><path d="M51 107Q27 45 57 30Q82 8 110 23Q146 14 161 49L152 118Z" fill="#311733"/><ellipse cx="105" cy="83" rx="45" ry="51" fill="url(#skin)"/><path d="M61 71Q44 42 77 28Q128 9 150 53Q125 63 108 42Q94 64 61 71" fill="#311733"/><circle cx="64" cy="104" r="6" fill="#fff4dc"/><circle cx="147" cy="104" r="6" fill="#fff4dc"/><path d="M76 70Q87 63 96 70M113 70Q124 63 133 71" fill="none" stroke="#311733" stroke-width="3" stroke-linecap="round"/><path d="M105 78L101 92Q105 96 110 92" fill="none" stroke="#8e4a33" stroke-width="2" stroke-linecap="round"/><ellipse class="eye" cx="87" cy="79" rx="4" ry="5" fill="#311733"/><ellipse cx="123" cy="79" rx="4" ry="5" fill="#311733"/><path class="smile" d="M88 101Q105 107 123 100Q115 122 103 119Q94 118 88 101" fill="#fff4dc"/><path class="hand" d="M158 152Q154 137 156 129L152 116Q151 110 155 111L162 122L162 103Q164 97 168 103L171 119L175 104Q178 100 181 105L179 121L185 111Q190 110 189 116L185 132Q182 146 173 153Z" fill="url(#skin)" stroke="#311733" stroke-width="2"/></svg>
<h1 tabindex="-1">Amani!</h1><small>Keep it a secret until gift day.</small></article></div><button id="close" class="quiet">Close my card</button></section>
</main><script defer src="demo.js"></script></html>
