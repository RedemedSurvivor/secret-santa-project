*{box-sizing:border-box}body{margin:0;background:#240f27;color:#fff4dc;font:15px 'DM Sans',sans-serif}main{max-width:1460px;margin:auto;padding:48px 5vw}header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:36px}h1,h2,h3{font-family:'Instrument Serif',Georgia,serif;font-weight:400;margin:0}h1{font-size:clamp(48px,8vw,110px);line-height:.85}header p{max-width:300px;margin:0;color:#dfc4d9}.boards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.label,.tag{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700}.label{margin:0 0 12px;color:#dfc4d9}.phone{height:520px;background:#fff4dc;color:#311733;border-radius:24px;overflow:hidden;padding:22px;display:flex;flex-direction:column;align-items:stretch;text-align:center;position:relative}.tag{margin-bottom:24px}.art{height:188px;display:grid;place-items:center;position:relative;isolation:isolate}.art:before{content:'';position:absolute;inset:8px;background:repeating-linear-gradient(135deg,transparent 0 5px,#64246414 5px 6px);border-radius:50%;z-index:-1}.avatar{font-size:107px;line-height:1;filter:drop-shadow(5px 7px 0 #341638)}.ticket{display:grid;place-items:center;width:135px;height:105px;background:#ff7443;border:2px dashed #311733;outline:5px solid #ff7443;transform:rotate(-12deg);box-shadow:8px 12px #341638;font:italic 57px 'Instrument Serif',Georgia,serif}.wheel{width:155px;aspect-ratio:1;border-radius:50%;border:7px solid #311733;background:repeating-conic-gradient(#ff7443 0 22.5deg,#fff4dc 22.5deg 45deg,#c29db9 45deg 67.5deg,#311733 67.5deg 90deg);display:grid;place-items:center}.wheel span{background:#311733;color:#fff4dc;border-radius:50%;width:53px;height:53px;display:grid;place-items:center;font-size:27px}.pointer{position:absolute;z-index:1;top:12px;color:#311733;font-size:25px}.phone h2{font-size:46px;line-height:.95;margin-top:14px}.phone p{font-size:13px;margin:12px auto;max-width:225px}.controls{margin-top:auto;di
